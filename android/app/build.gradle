plugins { id 'com.android.application' }
def bundleOfflineModel = providers.gradleProperty('bundleOfflineModel')
        .orElse(providers.gradleProperty('bundleSmolModel')).orElse('false').get().toBoolean()
def offlineAssets = layout.buildDirectory.dir('generated/lfm3-assets')
def catalogAssets = layout.buildDirectory.dir('generated/catalog-assets')
def translationLibs = layout.buildDirectory.dir('generated/translation-libs')
def translationEngine = providers.gradleProperty('translationEngine').orElse('bergamot').get()
if (!(translationEngine in ['tiny', 'bergamot'])) {
    throw new GradleException("Unknown translationEngine: ${translationEngine}")
}
android {
    namespace 'ru.cyber102.app'
    compileSdk 36
    buildToolsVersion "36.0.0"
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'ru.cyber102.app'
        minSdk 26
        targetSdk 36
        versionCode 19
        versionName bundleOfflineModel ? '0.18-lfm3-offline' : '0.18-lfm3-test'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DCMAKE_BUILD_TYPE=Release', '-DANDROID_STL=c++_static'
                targets 'cyber_smol'
            }
        }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    androidResources { noCompress += ['gguf'] }
    sourceSets.main.assets.srcDir(catalogAssets)
    if (bundleOfflineModel) { sourceSets.main.assets.srcDir(offlineAssets) }
    sourceSets.main.java.srcDir(rootProject.file("${translationEngine}/java"))
    sourceSets.main.assets.srcDir(rootProject.file("${translationEngine}/assets"))
    if (translationEngine == 'tiny') {
        sourceSets.main.jniLibs.srcDir(translationLibs)
    } else {
        sourceSets.main.assets.srcDir(rootProject.file('../var/models/bergamot-android/assets'))
    }
}

def bundleEquipmentCatalog = tasks.register('bundleEquipmentCatalog', Sync) {
    inputs.file(rootProject.file('../mobile/equipment-catalog.json'))
    from(rootProject.file('../mobile/equipment-catalog.json'))
    into(catalogAssets)
}
tasks.named('preBuild').configure { dependsOn bundleEquipmentCatalog }

if (translationEngine == 'tiny') {
    def buildOfflineTranslator = tasks.register('buildOfflineTranslator', Exec) {
        def script = rootProject.file('../tools/build_android_translator.py')
        inputs.file(script)
        inputs.dir(file('src/main/cpp/translation'))
        inputs.dir(rootProject.file('tiny/assets/en-ru'))
        outputs.dir(translationLibs)
        commandLine 'python3', script, '--sdk', android.sdkDirectory, '--ndk', android.ndkVersion,
                '--output', translationLibs.get().asFile
    }
    tasks.named('preBuild').configure { dependsOn buildOfflineTranslator }
} else {
    def verifyTranslator = tasks.register('verifyOfflineTranslator', Exec) {
        workingDir rootProject.file('..')
        commandLine 'python3', 'tools/prepare_android_bergamot.py'
    }
    tasks.named('preBuild').configure { dependsOn verifyTranslator }
}

dependencies {
    implementation "androidx.activity:activity:1.10.1"
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

if (bundleOfflineModel) {
    def prepareOfflineModel = tasks.register('prepareBundledOfflineModel') {
        def manifest = file('src/main/assets/models/model-manifest.json')
        def weights = rootProject.file('../var/models/lfm3-vl-2b')
        inputs.file(manifest)
        inputs.dir(weights)
        outputs.dir(offlineAssets)
        doLast {
            def catalog = new groovy.json.JsonSlurper().parse(manifest)
            // A model change must not leave older GGUFs inside the next APK.
            delete(offlineAssets.get().asFile)
            catalog.files.each { entry ->
                def source = new File(weights, entry.fileName as String)
                if (!source.isFile() || source.length() != (entry.size as long)) {
                    throw new GradleException("Missing model file: ${source}. Run tools/prepare_android_models.py first.")
                }
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                source.withInputStream { input ->
                    byte[] buffer = new byte[1024 * 1024]
                    int count
                    while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
                }
                if (digest.digest().encodeHex().toString() != entry.sha256) {
                    throw new GradleException("Model checksum mismatch: ${source.name}")
                }
                def destination = new File(offlineAssets.get().asFile, 'models/' + entry.fileName)
                destination.parentFile.mkdirs()
                // Link large assets when the generated directory shares the filesystem.
                try {
                    java.nio.file.Files.createLink(destination.toPath(), source.toPath())
                } catch (java.io.IOException | UnsupportedOperationException ignored) {
                    java.nio.file.Files.copy(source.toPath(), destination.toPath())
                }
            }
        }
    }
    tasks.named('preBuild').configure { dependsOn prepareOfflineModel }
}
